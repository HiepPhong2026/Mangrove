<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rừng Ngập Mặn – Những Câu Chuyện Nhỏ</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
  :root {
    --green1: #0d3d2b;
    --green2: #1a5c3e;
    --green3: #2e8b57;
    --green4: #4caf7d;
    --green5: #81d4a0;
    --green6: #b7f0c8;
    --green7: #e0faea;
    --accent: #f0fdf4;
    --leaf: #a8e6c0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(160deg, #e8f8ef 0%, #c6edd8 40%, #a8dfc0 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    text-align: center;
    padding: 28px 20px 18px;
    background: linear-gradient(135deg, var(--green1) 0%, var(--green2) 100%);
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }
  header h1 {
    font-family: 'Lora', serif;
    font-size: clamp(1.5rem, 4vw, 2.4rem);
    color: var(--green6);
    letter-spacing: 0.04em;
    text-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  header p {
    margin-top: 6px;
    color: var(--leaf);
    font-size: 0.88rem;
    opacity: 0.85;
  }

  .layout {
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
  }

  .story-display {
    flex: 1;
    overflow-y: auto;
    padding: 28px 24px 20px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  .story-card {
    max-width: 680px;
    width: 100%;
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 32px 36px;
    box-shadow: 0 8px 40px rgba(46,139,87,0.15), 0 0 0 1px rgba(76,175,80,0.12);
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .story-emoji { font-size: 2.8rem; margin-bottom: 12px; display: block; }
  .story-title {
    font-family: 'Lora', serif;
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--green1);
    margin-bottom: 16px;
    line-height: 1.3;
  }
  .story-body {
    font-family: 'Lora', serif;
    font-size: 1.05rem;
    color: #1e4a30;
    line-height: 1.85;
    font-style: italic;
  }
  .story-body em {
    font-style: normal;
    font-weight: 600;
    color: var(--green3);
  }
  .story-meta {
    margin-top: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .story-num {
    font-size: 0.75rem;
    background: var(--green7);
    color: var(--green3);
    border-radius: 20px;
    padding: 3px 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .divider { flex: 1; height: 1px; background: linear-gradient(to right, var(--green6), transparent); }

  .title-bar {
    background: linear-gradient(180deg, rgba(13,61,43,0.92) 0%, rgba(13,61,43,0.98) 100%);
    padding: 14px 16px 20px;
    flex-shrink: 0;
  }
  .title-bar-label {
    text-align: center;
    font-size: 0.7rem;
    color: var(--leaf);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 10px;
    opacity: 0.7;
  }
  .titles-list {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: thin;
    scrollbar-color: var(--green3) transparent;
  }
  .titles-list::-webkit-scrollbar { height: 3px; }
  .titles-list::-webkit-scrollbar-thumb { background: var(--green3); border-radius: 2px; }

  .title-btn {
    flex-shrink: 0;
    background: rgba(255,255,255,0.07);
    border: 1.5px solid rgba(76,175,80,0.25);
    color: var(--leaf);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
    font-family: 'Quicksand', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    transition: all 0.2s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .title-btn:hover {
    background: rgba(76,175,80,0.2);
    border-color: var(--green4);
    color: var(--green6);
    transform: translateY(-2px);
  }
  .title-btn.active {
    background: linear-gradient(135deg, var(--green3), var(--green4));
    border-color: var(--green5);
    color: #fff;
    box-shadow: 0 4px 14px rgba(46,139,87,0.4);
    transform: translateY(-2px);
  }

  .nav-row {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 12px;
  }
  .nav-btn {
    background: rgba(76,175,80,0.15);
    border: 1.5px solid rgba(76,175,80,0.3);
    color: var(--leaf);
    border-radius: 50%;
    width: 36px; height: 36px;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:hover { background: var(--green3); color: #fff; transform: scale(1.1); }
  .nav-counter {
    color: var(--leaf);
    font-size: 0.82rem;
    opacity: 0.7;
    display: flex;
    align-items: center;
    min-width: 50px;
    justify-content: center;
  }
</style>
</head>
<body>

<header>
  <h1>🌿 Rừng Ngập Mặn</h1>
  <p>Những câu chuyện nhỏ từ thiên nhiên</p>
</header>

<div class="layout">
  <div class="story-display">
    <div class="story-card" id="storyCard">
      <span class="story-emoji" id="storyEmoji"></span>
      <div class="story-title" id="storyTitle"></div>
      <div class="story-body" id="storyBody"></div>
      <div class="story-meta">
        <span class="story-num" id="storyNum"></span>
        <div class="divider"></div>
      </div>
    </div>
  </div>

  <div class="title-bar">
    <div class="title-bar-label">📖 Chọn câu chuyện</div>
    <div class="titles-list" id="titlesList"></div>
    <div class="nav-row">
      <button class="nav-btn" id="prevBtn">◀</button>
      <span class="nav-counter" id="navCounter"></span>
      <button class="nav-btn" id="nextBtn">▶</button>
    </div>
  </div>
</div>

<script>
const stories = [
  { emoji:"🦀", title:"Cua Bơi Ngược", body:`Cậu cua nhỏ luôn bị bạn bè chế giễu vì bơi ngược chiều nước. "Mày kỳ lạ lắm!" — chúng nói. Cậu im lặng, cứ bơi theo bản năng. Một ngày, cơn lũ ập đến. Cả đàn bị cuốn trôi theo dòng chảy xiết. Chỉ mình cậu cua bơi ngược — đúng hướng về tổ. Sáng hôm sau, cậu đứng trên bãi bùn an toàn, nhìn bạn bè mệt mỏi tìm đường về. Đôi khi, <em>khác biệt chính là điều cứu sống bạn.</em>` },
  { emoji:"🐟", title:"Con Cá Nhỏ Và Rễ Cây", body:`Cá con lạc mẹ trong mê cung rễ đước chằng chịt. Nó sợ hãi, cứ đâm đầu vào rễ này rễ kia. Bỗng một con cá già bơi đến. "Đừng chạy — hãy nhìn ánh sáng lọc qua kẽ rễ, đó là hướng ra." Cá con ngẩng đầu lên. Quả thật, từng tia nắng vàng xuyên qua mặt nước dẫn đường. Nó bơi theo ánh sáng và tìm được mẹ. <em>Rừng ngập mặn tối tăm, nhưng luôn có ánh sáng nếu bạn biết ngước nhìn.</em>` },
  { emoji:"🦅", title:"Con Diệc Và Bữa Sáng", body:`Con diệc đứng bất động trên bãi bùn từ lúc bình minh. Một tiếng đồng hồ, hai tiếng. Đàn cò bay qua cười: "Đứng mãi vậy có được gì?" Diệc không trả lời. Đến khi nắng lên cao, một con cá lớn bơi qua — diệc chớp mỏ, bắt gọn. Đó là bữa sáng ngon nhất của ngày. <em>Sự kiên nhẫn không phải là lãng phí thời gian — đó là cách những kẻ khôn ngoan săn mồi mà không tốn sức.</em>` },
  { emoji:"🐊", title:"Cá Sấu Học Làm Cha", body:`Lần đầu làm cha, cá sấu đực lúng túng khi vợ giao cho ổ trứng. Nó nằm canh suốt ba tháng, không dám rời nửa bước. Bọn cua bò qua, nó xua đuổi. Mưa lớn đến, nó che thân chắn nước. Đến ngày trứng nở, từng tiếng kêu nhỏ vang lên từ trong lòng đất. Cá sấu đực cẩn thận bới đất, nhẹ nhàng ngậm từng đứa con vào miệng — đưa ra sông. <em>Kẻ hung dữ nhất rừng ngập mặn cũng biết yêu thương.</em>` },
  { emoji:"🦎", title:"Tắc Kè Và Màu Sắc", body:`Tắc kè rừng ngập mặn có biệt tài đổi màu. Mỗi sáng, nó thử: xanh như lá đước, nâu như bùn, vàng như nắng xuyên tán cây. Một hôm thợ săn vào rừng. Tắc kè hoá thành màu vỏ cây — bất động. Thợ săn đứng ngay cạnh mà không nhìn thấy. Khi bóng người khuất, tắc kè thở phào. <em>Đôi khi ẩn mình không phải là hèn nhát — đó là sự khôn ngoan để tồn tại qua ngày mai.</em>` },
  { emoji:"🦋", title:"Con Bướm Lạc Rừng", body:`Bướm từ vườn hoa bay lạc vào rừng ngập mặn. Mọi thứ ẩm ướt, tối tăm, xa lạ. Nó muốn quay về nhưng không nhớ đường. Cây đước thì thầm: "Hãy theo dòng nước ra biển, rồi bay về phía mặt trời mọc." Bướm tin lời cây, bay theo kênh rạch, ra cửa sông, rồi về đất liền. Dọc đường, nó thấy những bông hoa mắm trắng tinh — đẹp theo cách riêng của rừng. <em>Đôi khi lạc đường lại cho ta thấy những vẻ đẹp chưa từng biết.</em>` },
  { emoji:"🦟", title:"Muỗi Và Bài Học Lớn", body:`Muỗi con hỏi mẹ: "Tại sao mình nhỏ bé thế mà sống được ở đây?" Mẹ muỗi đáp: "Vì mình biết mình nhỏ." Con không hiểu. Mẹ giải thích: "Cá sấu to lớn, nhiều kẻ muốn giết nó. Cò trắng đẹp đẽ, người ta bẫy nó. Còn mình — nhỏ bé, nhanh nhẹn, không ai thèm để ý." Muỗi con gật đầu. Từ đó, mỗi khi muốn lớn lên nhanh, nó lại nhớ lời mẹ — <em>và học cách tận dụng sự nhỏ bé của mình.</em>` },
  { emoji:"🐚", title:"Ốc Len Và Giấc Mơ", body:`Ốc len sống cả đời leo lên leo xuống rễ đước. Ngày qua ngày, cùng một cái cây, cùng một bãi bùn. Một con chim bay qua hỏi: "Mày không chán sao?" Ốc đáp: "Tao chưa leo hết cái cây này." Chim cười bay đi. Mùa sau quay lại, ốc len vẫn ở đó — nhưng đã lên đến ngọn. Từ đây, nó nhìn thấy cả rừng xanh trải dài đến chân trời. <em>Không cần đi xa. Đôi khi chinh phục những gì ngay trước mặt đã là cả một hành trình.</em>` },
  { emoji:"🦈", title:"Cá Đuối Và Đứa Trẻ", body:`Một đứa trẻ theo cha ra bãi triều, thấy cá đuối nằm trên bùn liền chạy đến sờ. Cá đuối giật mình phóng đi, đứa trẻ ngã sõng soài. Nó khóc. Cha bước đến, không dỗ ngay mà hỏi: "Con có đau không?" — "Có." — "Cá đuối cũng sợ. Cũng đau nếu bị bắt." Đứa trẻ nín khóc, nhìn theo vệt nước cá đuối trốn đi. <em>Lần đầu tiên nó hiểu: mọi sinh vật đều có nỗi sợ riêng, và tôn trọng chúng là điều con người cần học.</em>` },
  { emoji:"🌙", title:"Đom Đóm Cuối Rừng", body:`Đêm xuống, rừng ngập mặn tối đen như mực. Một con đom đóm nhỏ leo lên ngọn đước cao nhất, bật sáng. Chỉ một mình, giữa bóng tối mênh mông. Bạn bè bảo: "Ánh sáng mày bé lắm, chẳng soi được gì." Đom đóm vẫn sáng. Rồi một con nữa bay đến. Rồi mười con. Rồi cả ngàn con — cả rừng lung linh như sao sa. Tất cả bắt đầu từ một con đom đóm dám sáng trước. <em>Đừng đợi người khác — cứ toả sáng đi đã.</em>` }
];

let current = 0;

function render(idx, animate=true) {
  current = idx;
  const s = stories[idx];
  if (animate) {
    const card = document.getElementById('storyCard');
    card.style.animation = 'none';
    card.offsetHeight;
    card.style.animation = 'fadeIn 0.35s ease';
  }
  document.getElementById('storyEmoji').textContent = s.emoji;
  document.getElementById('storyTitle').textContent = s.title;
  document.getElementById('storyBody').innerHTML = s.body;
  document.getElementById('storyNum').textContent = `Câu ${idx+1} / ${stories.length}`;
  document.getElementById('navCounter').textContent = `${idx+1} / ${stories.length}`;
  document.querySelectorAll('.title-btn').forEach((btn, i) => btn.classList.toggle('active', i === idx));
  const activeBtn = document.querySelectorAll('.title-btn')[idx];
  if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

function buildTitles() {
  const list = document.getElementById('titlesList');
  stories.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'title-btn';
    btn.innerHTML = `<span>${s.emoji}</span>${s.title}`;
    btn.addEventListener('click', () => render(i));
    list.appendChild(btn);
  });
}

document.getElementById('prevBtn').addEventListener('click', () => render((current - 1 + stories.length) % stories.length));
document.getElementById('nextBtn').addEventListener('click', () => render((current + 1) % stories.length));

buildTitles();
render(0, false);
</script>
</body>
</html>
