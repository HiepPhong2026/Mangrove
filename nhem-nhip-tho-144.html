<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nhịp Thở 4-2-6 | [~._</title>
  <style>
    :root {
      --bg-color: #121413;
      --surface-color: #1b1e1c;
      --accent-color: #d4af37;
      --text-primary: #f5f2eb;
      --text-secondary: #a8a49c;
      --border-color: rgba(212, 175, 55, 0.25);
      --pulse-scale: 1;
      --transition-speed: 4s;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      transition: background-color 0.8s ease, color 0.8s ease;
      overflow-x: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
    }

    .theme-badge {
      font-size: 0.85rem;
      letter-spacing: 0.03em;
      color: var(--accent-color);
      font-weight: 700;
      max-width: 180px;
      line-height: 1.3;
    }

    .btn-switch-theme {
      background: var(--surface-color);
      color: var(--accent-color);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.2s ease, background-color 0.3s ease;
      white-space: nowrap;
      min-height: 44px;
    }

    .btn-switch-theme:active { transform: scale(0.95); }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 540px;
      width: 100%;
      margin: 0 auto;
      gap: 20px;
    }

    .intro-quote {
      font-size: 1.05rem;
      line-height: 1.65;
      color: var(--text-primary);
      opacity: 0.75;
      font-style: italic;
      min-height: 3.5em;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      transition: color 0.6s ease, opacity 0.6s ease;
    }

    /* ── Orb ── */
    .orb-container {
      position: relative;
      width: 240px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px 0;
    }

    .orb-glow {
      position: absolute;
      width: 110%;
      height: 110%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-color) 0%, transparent 70%);
      opacity: 0;
      transition: opacity var(--transition-speed) ease-in-out;
      pointer-events: none;
    }

    .orb-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      background: radial-gradient(circle, var(--surface-color) 40%, transparent 100%);
      transform: scale(var(--pulse-scale));
      transition: transform var(--transition-speed) ease-in-out,
                  border-color 0.8s ease;
    }

    .orb-core {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .phase-label {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-color);
      margin-bottom: 4px;
      letter-spacing: 0.02em;
      transition: color 0.5s ease;
    }

    .timer-display {
      font-size: 5rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: var(--text-primary);
    }

    .phase-sub {
      font-size: 1rem;
      color: var(--text-primary);
      opacity: 0.65;
      margin-top: 8px;
      font-weight: 500;
    }

    /* ── Progress bar ── */
    .progress-wrap {
      width: 100%;
      max-width: 300px;
      height: 5px;
      background: var(--surface-color);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--accent-color);
      border-radius: 999px;
      width: 0%;
      transition: width 1s linear, background-color 0.8s ease;
    }

    /* ── Status row ── */
    .status-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .cycle-counter {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
      background: var(--surface-color);
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      transition: background-color 0.4s ease, border-color 0.4s ease;
    }

    .target-selector {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .target-chip {
      background: var(--surface-color);
      color: var(--text-primary);
      opacity: 0.65;
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 40px;
      transition: all 0.2s ease;
    }

    .target-chip.active {
      background: var(--accent-color);
      color: var(--bg-color);
      opacity: 1;
      border-color: var(--accent-color);
    }

    /* ── Controls ── */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 360px;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: var(--bg-color);
      border: none;
      padding: 18px 24px;
      border-radius: 16px;
      font-size: 1.25rem;
      font-weight: 700;
      cursor: pointer;
      min-height: 56px;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }

    .btn-primary:active { transform: scale(0.98); }

    .secondary-controls {
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      flex: 1;
      background-color: var(--surface-color);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 13px 8px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 48px;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    /* ── Done overlay ── */
    .done-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      padding: 32px;
    }

    .done-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .done-emblem {
      font-size: 3.5rem;
      line-height: 1;
    }

    .done-title {
      font-size: 1.9rem;
      font-weight: 700;
      color: var(--accent-color);
    }

    .done-sub {
      font-size: 1.05rem;
      color: var(--text-primary);
      opacity: 0.75;
      text-align: center;
      line-height: 1.7;
    }

    .done-prop {
      font-size: 1rem;
      color: var(--accent-color);
      opacity: 0.9;
      text-align: center;
      line-height: 1.65;
      font-style: italic;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px 20px;
      background: var(--surface-color);
      max-width: 420px;
    }

    .done-prop-label {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 8px;
      display: block;
    }

    .done-btn {
      background: var(--accent-color);
      color: var(--bg-color);
      border: none;
      padding: 16px 40px;
      border-radius: 16px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      min-height: 54px;
      margin-top: 8px;
    }

    footer {
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-primary);
      opacity: 0.5;
      padding-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div class="theme-badge" id="themeName">Euclid</div>
    <button class="btn-switch-theme" id="switchThemeBtn" title="Đổi mệnh đề khác">
      <span>[~._</span> Đổi mệnh đề
    </button>
  </header>

  <main>
    <p class="intro-quote" id="introQuote">
      "Dựng mọi cấu trúc từ những tiên đề phẳng, sáng rõ và hiển nhiên nhất."
    </p>

    <div class="orb-container">
      <div class="orb-glow" id="orbGlow"></div>
      <div class="orb-ring" id="orbRing"></div>
      <div class="orb-core">
        <div class="phase-label" id="phaseLabel">Sẵn sàng</div>
        <div class="timer-display" id="timerDisplay">4-2-6</div>
        <div class="phase-sub" id="phaseSub">12 giây mỗi nhịp</div>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="status-row">
      <div class="cycle-counter" id="cycleCounter">Vòng thở: 0</div>
      <div class="target-selector" id="targetSelector">
        <button class="target-chip active" data-target="0">Tự do</button>
        <button class="target-chip" data-target="12">12 vòng · 2 phút</button>
        <button class="target-chip" data-target="30">30 vòng · 6 phút</button>
        <button class="target-chip" data-target="60">60 vòng · 12 phút</button>
      </div>
    </div>

    <div class="controls">
      <button class="btn-primary" id="startStopBtn">Bắt đầu thở</button>
      <div class="secondary-controls">
        <button class="btn-secondary" id="soundToggleBtn">🔔 Chuông</button>
        <button class="btn-secondary" id="voiceToggleBtn">🗣 Giọng đọc</button>
        <button class="btn-secondary" id="vibToggleBtn">📳 Rung</button>
      </div>
    </div>
  </main>

  <footer id="footerEl">Nhịp 4-2-6 · Không vội, không gồng</footer>

  <!-- Màn hình kết thúc -->
  <div class="done-overlay" id="doneOverlay">
    <div class="done-emblem" id="doneEmblem">◎</div>
    <div class="done-title">Hoàn thành</div>
    <div class="done-sub" id="doneSub">Bạn đã thở xong. Giữ cảm giác này thêm một chút.</div>
    <div class="done-prop" id="doneProp">
      <span class="done-prop-label">Điểm đối trọng</span>
      <span id="donePropText"></span>
    </div>
    <button class="done-btn" id="doneBtn">Thở lại</button>
  </div>

  <script>
  // ============================================================
  // 1. DỮ LIỆU 48 THEME — 48 Mệnh Đề Đối Trọng
  // ============================================================

  // Màu sắc: 8 bảng màu xoay vòng để các mệnh đề liên quan có cùng "không khí"

    { bg:"#0f1c2e", surface:"#172840", accent:"#8ecae6", textPrimary:"#f1f6f9", textSecondary:"#9bb1c4", border:"rgba(142,202,230,0.3)", bellFreqs:[396,528,639] },
    // 5 · Phù sa - vàng đất (trực giác, bí ẩn: Poincaré, Al-Khwarizmi…)
    { bg:"#231f1d", surface:"#302a27", accent:"#c9a66b", textPrimary:"#f2ece4", textSecondary:"#afa395", border:"rgba(201,166,107,0.3)", bellFreqs:[174,285,396] },

  ];

  const THEMES = [
    // ── NHÓM A: 24 MỆNH ĐỀ TRỤ CỘT ──
    {
      id:"01-euclid", num:"01", name:"Euclid",
      quote:""Dựng mọi cấu trúc từ những tiên đề phẳng, sáng rõ và hiển nhiên nhất."",
      inhale:"Dựng gốc", hold:"Giữ vững", exhale:"Trải ra",

  // ============================================================
  // 2. THEME ENGINE — random, chống trùng, anti-repeat localStorage
  // ============================================================
  let currentTheme = THEMES[0];
  const STORAGE_KEY = "last_426_theme";

  function getPalette(theme) {
    return PALETTES[theme.p % PALETTES.length];
  }

  function applyTheme(theme) {
    currentTheme = theme;
    const pal = getPalette(theme);
    const r = document.documentElement;
    r.style.setProperty("--bg-color",        pal.bg);
    r.style.setProperty("--surface-color",   pal.surface);
    r.style.setProperty("--accent-color",     pal.accent);
    r.style.setProperty("--text-primary",     pal.textPrimary);
    r.style.setProperty("--text-secondary",   pal.textSecondary);
    r.style.setProperty("--border-color",     pal.border);

    const el = id => document.getElementById(id);
    if (el("themeName"))  el("themeName").textContent  = theme.num + " · " + theme.name;
    if (el("introQuote")) el("introQuote").textContent = theme.quote;
    if (el("doneEmblem")) el("doneEmblem").textContent = theme.doneEmblem;
    if (el("doneSub"))    el("doneSub").textContent    = theme.doneSub;

    // Hiển thị mệnh đề đối trọng trong done overlay
    const counterpart = THEMES.find(t => t.id === theme.counterpartId);
    if (counterpart && el("donePropText")) {
      const label = parseInt(theme.num, 10) <= 24 ? "Đối trọng " + counterpart.num + " · " + counterpart.name : "Trụ cột " + counterpart.num + " · " + counterpart.name;
      el("donePropText").textContent = label + ": " + counterpart.quote;
    }

    if (isRunning) updatePhaseText(PHASES[phaseIndex]);

    try { localStorage.setItem(STORAGE_KEY, theme.id); } catch(e) {}
  }

  function pickTheme(excludeId) {
    const pool = THEMES.filter(t => t.id !== excludeId);
    return pool[Math.floor(Math.random() * pool.length)];
  }

  // ============================================================
  // 3. WAKE LOCK
  // ============================================================
  let wakeLock = null;
  let footerEl = null;

  async function acquireWakeLock() {
    if (!("wakeLock" in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      if (footerEl) footerEl.textContent = "Nhịp 4-2-6 · Đang giữ sáng màn hình";
      wakeLock.addEventListener("release", () => {
        if (!isRunning && footerEl) footerEl.textContent = "Nhịp 4-2-6 · Không vội, không gồng";
      });
    } catch(e) {
      if (footerEl) footerEl.textContent = "Nhịp 4-2-6 · Mở bằng Safari/Chrome (HTTPS) để giữ sáng";
    }
  }

  async function releaseWakeLock() {
    if (wakeLock) { try { await wakeLock.release(); } catch(e) {} wakeLock = null; }
    if (footerEl) footerEl.textContent = "Nhịp 4-2-6 · Không vội, không gồng";
  }

  document.addEventListener("visibilitychange", async () => {
    if (isRunning && document.visibilityState === "visible") await acquireWakeLock();
  });

  // ============================================================
  // 4. ÂM THANH — FM Synthesis
  // ============================================================
  let soundEnabled = true;
  let audioCtx = null;

  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function playBell(freqArr, volume = 0.22) {
    if (!soundEnabled) return;
    try {
      const ctx = getCtx();
      const now = ctx.currentTime;
      freqArr.forEach((freq, i) => {
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        const mod  = ctx.createOscillator();
        const modG = ctx.createGain();
        mod.frequency.value  = freq * 2.756;
        modG.gain.value      = freq * 1.4;
        mod.connect(modG);
        modG.connect(osc.frequency);
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now);
        const vol = volume / (i + 1);
        gain.gain.setValueAtTime(0.001, now + i * 0.015);
        gain.gain.exponentialRampToValueAtTime(vol, now + i * 0.015 + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.015 + 2.6);
        osc.connect(gain);
        gain.connect(ctx.destination);
        mod.start(now + i * 0.015);
        osc.start(now + i * 0.015);
        mod.stop(now + i * 0.015 + 2.7);
        osc.stop(now + i * 0.015 + 2.7);
      });
    } catch(e) {}
  }

  // ============================================================
  // 5. GIỌNG ĐỌC TIẾNG VIỆT
  // ============================================================
  let voiceEnabled = true;
  let preferredVoice = null;

  function loadVoice() {
    if (!("speechSynthesis" in window)) return;
    const vs = window.speechSynthesis.getVoices();
    const vi = vs.filter(v => v.lang.toLowerCase().includes("vi"));
    if (vi.length) {
      preferredVoice = vi.find(v => /hoaimy|linh|nu|female|south/i.test(v.name)) || vi[0];
    }
  }
  if ("speechSynthesis" in window) {
    loadVoice();
    window.speechSynthesis.onvoiceschanged = loadVoice;
  }

  function speak(text) {
    if (!voiceEnabled || !("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "vi-VN";
    if (preferredVoice) u.voice = preferredVoice;
    u.rate = 0.82;
    u.pitch = 1.0;
    window.speechSynthesis.speak(u);
  }

  // ============================================================
  // 6. RUNG
  // ============================================================
  let vibEnabled = true;
  function vibrate(pattern) {
    if (!vibEnabled || !navigator.vibrate) return;
    navigator.vibrate(pattern);
  }

  // ============================================================
  // 7. CỐT LÕI NHỊP 4-2-6
  // ============================================================
  const PHASES = [
    { key: "inhale", dur: 4,  scale: 1.26, glowOpacity: 0.07, sub: "Hít vào · 4 giây" },
    { key: "hold",   dur: 2,  scale: 1.26, glowOpacity: 0.12, sub: "Giữ nhẹ · 2 giây" },
    { key: "exhale", dur: 6,  scale: 0.82, glowOpacity: 0,    sub: "Thở ra · 6 giây"  }
  ];

  let isRunning    = false;
  let phaseIndex   = 0;
  let secLeft      = 0;
  let cycleCount   = 0;
  let targetCycles = 0;
  let totalSecs    = 0;
  let timerInterval = null;

  // DOM refs — set inside init() after DOMContentLoaded
  let phaseLabel, timerDisplay, phaseSub, cycleCounter,
      orbRing, orbGlow, progressBar, startStopBtn;

  function updatePhaseText(ph) {
    if (phaseLabel) phaseLabel.textContent = currentTheme[ph.key];
    if (phaseSub)   phaseSub.textContent   = ph.sub;
  }

  function updateProgress() {
    if (!progressBar) return;
    if (targetCycles === 0) { progressBar.style.width = "0%"; return; }
    progressBar.style.width = Math.min(100, (cycleCount / targetCycles) * 100) + "%";
  }

  function enterPhase(idx) {
    phaseIndex = idx;
    const ph = PHASES[idx];
    secLeft = ph.dur;
    updatePhaseText(ph);
    if (timerDisplay) timerDisplay.textContent = secLeft;

    const pal = getPalette(currentTheme);
    if (orbRing) {
      orbRing.style.transition = `transform ${ph.dur}s ease-in-out, border-color 0.8s ease`;
      orbRing.style.transform  = `scale(${ph.scale})`;
    }
    if (orbGlow) {
      orbGlow.style.transition = `opacity ${ph.dur}s ease-in-out`;
      orbGlow.style.opacity    = ph.glowOpacity;
    }

    playBell(pal.bellFreqs);
    speak(currentTheme[ph.key]);
    if (ph.key === "inhale")    vibrate([60]);
    else if (ph.key === "hold") vibrate([30, 30, 30]);
    else                        vibrate([80]);
  }

  function tick() {
    totalSecs++;
    secLeft--;
    if (secLeft > 0) {
      if (timerDisplay) timerDisplay.textContent = secLeft;
      return;
    }
    const next = (phaseIndex + 1) % PHASES.length;
    if (next === 0) {
      cycleCount++;
      if (cycleCounter) cycleCounter.textContent = targetCycles
        ? `Vòng thở: ${cycleCount} / ${targetCycles}`
        : `Vòng thở: ${cycleCount}`;
      updateProgress();
      if (targetCycles > 0 && cycleCount >= targetCycles) { finishSession(); return; }
    }
    enterPhase(next);
  }

  function startBreathing() {
    isRunning = true;
    cycleCount = 0;
    totalSecs  = 0;
    if (cycleCounter) cycleCounter.textContent = targetCycles ? `Vòng thở: 0 / ${targetCycles}` : `Vòng thở: 0`;
    if (startStopBtn) startStopBtn.textContent = "Tạm dừng";
    updateProgress();
    enterPhase(0);
    acquireWakeLock();
    timerInterval = setInterval(tick, 1000);
  }

  function stopBreathing(keepCount = false) {
    isRunning = false;
    clearInterval(timerInterval);
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    releaseWakeLock();
    if (orbRing) { orbRing.style.transition = "transform 0.6s ease"; orbRing.style.transform = "scale(1)"; }
    if (orbGlow) orbGlow.style.opacity = 0;
    if (phaseLabel)   phaseLabel.textContent   = "Tạm nghỉ";
    if (timerDisplay) timerDisplay.textContent = "4-2-6";
    if (phaseSub)     phaseSub.textContent     = "Bấm để tiếp tục nhịp";
    if (!keepCount) {
      if (cycleCounter) cycleCounter.textContent = "Vòng thở: 0";
      if (progressBar)  progressBar.style.width  = "0%";
    }
    if (startStopBtn) startStopBtn.textContent = "Tiếp tục thở";
  }

  function finishSession() {
    stopBreathing(true);
    const mins = Math.round(totalSecs / 60);
    const doneSubEl = document.getElementById("doneSub");
    if (doneSubEl) doneSubEl.textContent = currentTheme.doneSub + ` (${cycleCount} vòng · ${mins} phút)`;
    const overlay = document.getElementById("doneOverlay");
    if (overlay) overlay.classList.add("show");
    speak("Hoàn thành. " + currentTheme.doneSub);
    vibrate([100, 50, 100, 50, 200]);
  }

  // ============================================================
  // 8. KHỞI TẠO — chạy sau khi DOM sẵn sàng
  // ============================================================
  document.addEventListener("DOMContentLoaded", function() {
    // Lấy DOM refs
    phaseLabel   = document.getElementById("phaseLabel");
    timerDisplay = document.getElementById("timerDisplay");
    phaseSub     = document.getElementById("phaseSub");
    cycleCounter = document.getElementById("cycleCounter");
    orbRing      = document.getElementById("orbRing");
    orbGlow      = document.getElementById("orbGlow");
    progressBar  = document.getElementById("progressBar");
    startStopBtn = document.getElementById("startStopBtn");
    footerEl     = document.getElementById("footerEl");

    // Áp dụng theme ban đầu (tránh lặp theme cũ)
    let last = null;
    try { last = localStorage.getItem(STORAGE_KEY); } catch(e) {}
    applyTheme(pickTheme(last));

    // Nút đổi mệnh đề
    document.getElementById("switchThemeBtn").addEventListener("click", () => {
      applyTheme(pickTheme(currentTheme.id));
    });

    // Nút bắt đầu / tạm dừng
    startStopBtn.addEventListener("click", () => {
      isRunning ? stopBreathing() : startBreathing();
    });

    // Nút "Thở lại" trên done overlay
    document.getElementById("doneBtn").addEventListener("click", () => {
      document.getElementById("doneOverlay").classList.remove("show");
      if (cycleCounter) cycleCounter.textContent = "Vòng thở: 0";
      if (progressBar)  progressBar.style.width  = "0%";
      startStopBtn.textContent = "Bắt đầu thở";
    });

    // Target chips
    document.getElementById("targetSelector").addEventListener("click", e => {
      const chip = e.target.closest(".target-chip");
      if (!chip) return;
      document.querySelectorAll(".target-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      targetCycles = parseInt(chip.dataset.target, 10);
      updateProgress();
    });

    // Sound / Voice / Vib toggles
    const soundBtn = document.getElementById("soundToggleBtn");
    const voiceBtn = document.getElementById("voiceToggleBtn");
    const vibBtn   = document.getElementById("vibToggleBtn");

    soundBtn.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? "🔔 Chuông" : "🔕 Chuông";
    });
    voiceBtn.addEventListener("click", () => {
      voiceEnabled = !voiceEnabled;
      if (!voiceEnabled && "speechSynthesis" in window) window.speechSynthesis.cancel();
      voiceBtn.textContent = voiceEnabled ? "🗣 Giọng đọc" : "🔇 Giọng đọc";
    });
    vibBtn.addEventListener("click", () => {
      vibEnabled = !vibEnabled;
      vibBtn.textContent = vibEnabled ? "📳 Rung" : "📴 Rung";
    });
  });
  </script>
</body>
</html>
