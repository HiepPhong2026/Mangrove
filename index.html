<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Rừng Ngập Mặn – Những Câu Chuyện Nhỏ</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
  :root {
    --g1: #0d3d2b;
    --g2: #1a5c3e;
    --g3: #2e8b57;
    --g4: #4caf7d;
    --g5: #81d4a0;
    --g6: #b7f0c8;
    --g7: #e0faea;
    --leaf: #a8e6c0;
    --text: #0f3522;
    --card: rgba(255,255,255,0.82);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(160deg, #d6f5e3 0%, #b2e8c8 50%, #8dd5b0 100%);
    display: flex;
    flex-direction: column;
  }

  header {
    background: linear-gradient(135deg, var(--g1), var(--g2));
    padding: 16px 20px 14px;
    text-align: center;
    flex-shrink: 0;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }
  header h1 {
    font-family: 'Lora', serif;
    font-size: 1.35rem;
    color: var(--g6);
    letter-spacing: 0.04em;
  }
  header p {
    font-size: 0.72rem;
    color: var(--leaf);
    margin-top: 3px;
    opacity: 0.8;
  }

  .story-wrap {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 14px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .story-card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 18px;
    padding: 22px 20px 20px;
    box-shadow: 0 6px 28px rgba(13,61,43,0.14), 0 0 0 1px rgba(76,175,80,0.13);
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .story-emoji { font-size: 2rem; line-height: 1; }
  .story-title {
    font-family: 'Lora', serif;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--g1);
    line-height: 1.3;
  }

  .story-body {
    font-family: 'Lora', serif;
    font-size: 0.97rem;
    color: #1b4530;
    line-height: 1.8;
    font-style: italic;
  }
  .story-body em {
    font-style: normal;
    font-weight: 600;
    color: var(--g3);
  }

  .badge {
    display: inline-block;
    margin-top: 14px;
    font-size: 0.68rem;
    background: var(--g7);
    color: var(--g3);
    border-radius: 20px;
    padding: 3px 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    font-family: 'Quicksand', sans-serif;
    font-style: normal;
  }

  .nav-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    padding: 10px 14px 6px;
    flex-shrink: 0;
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
  }
  .nav-btn {
    background: var(--g2);
    border: none;
    color: var(--g6);
    border-radius: 50%;
    width: 44px; height: 44px;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    transition: background 0.15s, transform 0.1s;
    touch-action: manipulation;
  }
  .nav-btn:active { background: var(--g3); transform: scale(0.93); }
  .nav-counter {
    font-size: 0.82rem;
    color: var(--g1);
    font-weight: 700;
    min-width: 52px;
    text-align: center;
    opacity: 0.75;
  }

  .select-bar {
    background: linear-gradient(180deg, rgba(13,61,43,0.93), rgba(10,45,28,0.98));
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
    flex-shrink: 0;
    box-shadow: 0 -2px 12px rgba(0,0,0,0.2);
  }
  .select-wrap {
    position: relative;
  }
  .select-wrap::after {
    content: '▾';
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--g5);
    font-size: 1rem;
    pointer-events: none;
  }
  .story-select {
    width: 100%;
    background: rgba(255,255,255,0.1);
    border: 1.5px solid rgba(76,175,80,0.3);
    color: var(--leaf);
    border-radius: 10px;
    padding: 10px 36px 10px 12px;
    font-family: 'Quicksand', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    outline: none;
  }
  .story-select option {
    background: #0d3d2b;
    color: #e0faea;
  }
</style>
</head>
<body>

<header>
  <h1>🌿 Rừng Ngập Mặn</h1>
  <p>Những câu chuyện nhỏ từ thiên nhiên</p>
</header>

<div class="story-wrap" id="storyWrap">
  <div class="story-card" id="storyCard">
    <div class="card-top">
      <span class="story-emoji" id="sEmoji"></span>
      <div class="story-title" id="sTitle"></div>
    </div>
    <div class="story-body" id="sBody"></div>
    <span class="badge" id="sBadge"></span>
  </div>
</div>

<div class="nav-row">
  <button class="nav-btn" id="prevBtn" aria-label="Trước">◀</button>
  <span class="nav-counter" id="navCtr"></span>
  <button class="nav-btn" id="nextBtn" aria-label="Tiếp">▶</button>
</div>

<div class="select-bar">
  <div class="select-wrap">
    <select class="story-select" id="storySelect"></select>
  </div>
</div>

let cur = 0;

function render(idx, anim=true) {
  cur = idx;
  const s = stories[idx];
  if (anim) {
    const c = document.getElementById('storyCard');
    c.style.animation = 'none'; c.offsetHeight;
    c.style.animation = 'slideUp 0.3s ease';
  }
  document.getElementById('sEmoji').textContent = s.e;
  document.getElementById('sTitle').textContent = s.t;
  document.getElementById('sBody').innerHTML = s.b;
  document.getElementById('sBadge').textContent = `Câu ${idx+1} / ${stories.length}`;
  document.getElementById('navCtr').textContent = `${idx+1} / ${stories.length}`;
  document.getElementById('storySelect').value = idx;
  document.getElementById('storyWrap').scrollTo({top:0, behavior:'smooth'});
}

const sel = document.getElementById('storySelect');
stories.forEach((s,i) => {
  const o = document.createElement('option');
  o.value = i;
  o.textContent = `${s.e}  ${s.t}`;
  sel.appendChild(o);
});
sel.addEventListener('change', () => render(+sel.value));

let sx = 0;
const wrap = document.getElementById('storyWrap');
wrap.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, {passive:true});
wrap.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 50) render(dx < 0 ? (cur+1)%stories.length : (cur-1+stories.length)%stories.length);
}, {passive:true});

document.getElementById('prevBtn').addEventListener('click', () => render((cur-1+stories.length)%stories.length));
document.getElementById('nextBtn').addEventListener('click', () => render((cur+1)%stories.length));

render(0, false);
</script>
