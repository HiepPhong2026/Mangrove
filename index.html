<style>
:root {
  --g1:#0a2e1a; --g2:#0f4a2a; --g3:#1a6b3c; --g4:#2d8f55;
  --g5:#4db375; --g6:#7ecf9e; --g7:#b8e8c8;
  --leaf:#3fa865; --card:#0d3b22; --txt:#e8f5ee;
  --sub:#a0c8b0; --dim:#5a8a6a;
  --radius:16px; --font:'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--g1);color:var(--txt);font-family:var(--font);min-height:100dvh;display:flex;flex-direction:column;align-items:center}
header{width:100%;padding:16px;text-align:center;background:linear-gradient(135deg,var(--g2),var(--g3));border-bottom:1px solid var(--g4)}
header h1{font-size:1.4rem;letter-spacing:.5px}
header p{color:var(--sub);font-size:.85rem;margin-top:4px}

#ses-bar{display:flex;gap:8px;padding:10px 16px 4px;overflow-x:auto;width:100%;max-width:480px;scrollbar-width:none}
#ses-bar::-webkit-scrollbar{display:none}
.ses-btn{flex:0 0 auto;padding:5px 18px;border:1.5px solid var(--g3);border-radius:20px;background:transparent;color:var(--dim);font-size:.8rem;font-weight:600;letter-spacing:.5px;cursor:pointer;transition:.2s}
.ses-btn.active{background:var(--g3);border-color:var(--g4);color:var(--g7)}
.ses-btn:hover:not(.active){border-color:var(--g4);color:var(--sub)}

#vol-bar{display:flex;gap:8px;padding:8px 16px;overflow-x:auto;width:100%;max-width:480px;scrollbar-width:none}
#vol-bar::-webkit-scrollbar{display:none}
.vol-btn{flex:0 0 auto;padding:6px 16px;border:1.5px solid var(--g4);border-radius:20px;background:transparent;color:var(--sub);font-size:.85rem;cursor:pointer;transition:.2s}
.vol-btn.active{background:var(--leaf);border-color:var(--leaf);color:#fff;font-weight:600}
.vol-btn:hover:not(.active){border-color:var(--g5);color:var(--txt)}

#controls{display:flex;align-items:center;gap:10px;padding:8px 16px;width:100%;max-width:480px}
#story-sel{flex:1;padding:8px 12px;border-radius:10px;border:1px solid var(--g4);background:var(--g2);color:var(--txt);font-size:.9rem}
#counter{color:var(--sub);font-size:.85rem;white-space:nowrap;min-width:60px;text-align:right}

#story-wrap{width:100%;max-width:480px;flex:1;overflow:hidden;position:relative;padding:0 16px 16px}
.card{background:var(--card);border-radius:var(--radius);padding:24px;border:1px solid var(--g3);min-height:300px;display:flex;flex-direction:column;gap:16px}
.card-emoji{font-size:2.8rem;text-align:center}
.card-title{font-size:1.15rem;font-weight:700;color:var(--g7);text-align:center;line-height:1.4}
.card-body{font-size:1rem;line-height:1.7;color:var(--txt);flex:1}
.card-body strong{color:var(--g6);font-style:italic}

#nav{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:480px;padding:8px 16px 4px}
.nav-btn{background:var(--g2);border:1.5px solid var(--g4);color:var(--txt);padding:10px 22px;border-radius:12px;font-size:1rem;cursor:pointer;transition:.2s}
.nav-btn:hover{background:var(--g3);border-color:var(--g5)}
.nav-btn:disabled{opacity:.3;cursor:default}
#rand-btn{background:var(--g3);border-color:var(--leaf);padding:10px 18px}

#visit-counter{text-align:center;padding:8px 0 16px;color:var(--g6);font-size:0.78rem;opacity:0.7;letter-spacing:0.03em}

/* ===== LIBRARY MODAL ===== */
#lib-overlay{
  position:fixed;inset:0;z-index:1200;
  background:rgba(0,0,0,0.55);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
#lib-overlay.open{opacity:1;pointer-events:auto;}
#lib-sheet{
  width:100%;max-width:520px;
  background:linear-gradient(160deg,#0d3b22,#0a2e1a);
  border:1.5px solid rgba(255,255,255,0.12);
  border-radius:24px 24px 0 0;
  padding:20px 20px 36px;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  max-height:92dvh;overflow-y:auto;
}
#lib-overlay.open #lib-sheet{transform:translateY(0);}
.lib-drop{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:2px dashed rgba(255,255,255,0.2);border-radius:14px;
  padding:24px 16px;cursor:pointer;transition:border-color .2s,background .2s;
  margin-bottom:16px;
}
.lib-drop:hover,.lib-drop.drag-over{border-color:var(--leaf);background:rgba(63,168,101,.08)}
.lib-drop input{display:none}
.lib-file-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:10px;
  background:rgba(255,255,255,0.05);
  margin-bottom:8px;cursor:pointer;transition:background .15s;
}
.lib-file-item:hover{background:rgba(255,255,255,0.1)}
.lib-file-icon{font-size:1.4rem;flex-shrink:0}
.lib-file-info{flex:1;min-width:0}
.lib-file-name{font-size:.88rem;font-weight:600;line-height:1.35;word-break:break-word}
.lib-file-meta{font-size:.74rem;color:var(--sub);margin-top:2px}
.lib-file-actions{display:flex;gap:6px;flex-shrink:0}
.lib-btn{background:rgba(255,255,255,0.1);border:none;color:#fff;border-radius:7px;
  padding:5px 10px;font-size:.75rem;cursor:pointer;transition:background .15s}
.lib-btn:hover{background:rgba(255,255,255,0.2)}
#lib-reader-body{
  font-size:.9rem;line-height:1.8;color:var(--txt);
  background:rgba(255,255,255,0.04);border-radius:14px;
  padding:18px 16px;word-break:break-word;
  max-height:62dvh;overflow-y:auto;
}
#lib-reader-body iframe{width:100%;border:none;border-radius:8px;min-height:55dvh}
/* Markdown rendered styles */
#lib-reader-body h1{font-size:1.15rem;font-weight:700;color:#a8e6c3;margin:0 0 12px;line-height:1.35;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:8px}
#lib-reader-body h2{font-size:1rem;font-weight:700;color:#7ecf9e;margin:18px 0 8px;line-height:1.35}
#lib-reader-body h3{font-size:.92rem;font-weight:600;color:#5bbf8a;margin:14px 0 6px}
#lib-reader-body h4{font-size:.88rem;font-weight:600;color:var(--sub);margin:10px 0 4px}
#lib-reader-body p{margin:0 0 10px}
#lib-reader-body ul,#lib-reader-body ol{padding-left:1.3em;margin:6px 0 10px}
#lib-reader-body li{margin:3px 0}
#lib-reader-body strong{color:#c8f0d8;font-weight:700}
#lib-reader-body em{color:#9ed8b8;font-style:italic}
#lib-reader-body blockquote{border-left:3px solid var(--leaf);margin:12px 0;padding:8px 14px;background:rgba(63,168,101,0.08);border-radius:0 8px 8px 0;color:var(--sub);font-style:italic}
#lib-reader-body code{background:rgba(255,255,255,0.1);border-radius:4px;padding:1px 5px;font-size:.82rem;font-family:monospace}
#lib-reader-body pre{background:rgba(0,0,0,0.3);border-radius:8px;padding:12px;overflow-x:auto;margin:10px 0;font-size:.8rem;line-height:1.5}
#lib-reader-body pre code{background:none;padding:0}
#lib-reader-body hr{border:none;border-top:1px solid rgba(255,255,255,0.1);margin:14px 0}
#lib-reader-body table{border-collapse:collapse;width:100%;margin:10px 0;font-size:.82rem}
#lib-reader-body th{background:rgba(63,168,101,0.2);color:#a8e6c3;font-weight:600;padding:7px 10px;border:1px solid rgba(255,255,255,0.1);text-align:left}
#lib-reader-body td{padding:6px 10px;border:1px solid rgba(255,255,255,0.08);vertical-align:top}
#lib-reader-body tr:nth-child(even) td{background:rgba(255,255,255,0.03)}

/* ===== MUSIC MODAL ===== */
#music-overlay{
  position:fixed;inset:0;z-index:1200;
  background:rgba(0,0,0,0.55);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
#music-overlay.open{opacity:1;pointer-events:auto;}
#music-sheet{
  width:100%;max-width:480px;
  background:linear-gradient(160deg,#0d3b22,#0a2e1a);
  border:1.5px solid rgba(255,255,255,0.12);
  border-radius:24px 24px 0 0;
  padding:20px 20px 32px;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  max-height:88dvh;overflow-y:auto;
}
#music-overlay.open #music-sheet{transform:translateY(0);}
.ms-handle{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,0.2);margin:0 auto 18px;}
.ms-title{font-size:1rem;font-weight:700;color:var(--g7);margin-bottom:16px;}
.ms-hint{font-size:.75rem;color:var(--dim);}
.ms-btn{
  width:100%;padding:13px;border-radius:12px;
  background:var(--leaf);border:none;color:#fff;
  font-size:.95rem;font-weight:600;cursor:pointer;
  transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;
}
.ms-btn:active{opacity:.8;}
.ms-btn:disabled{opacity:.5;cursor:not-allowed;}
.ms-btn-sec{background:var(--g3);}
.ms-upload-box{
  border:2px dashed var(--g4);border-radius:12px;
  padding:28px 16px;text-align:center;cursor:pointer;
  transition:.2s;color:var(--sub);font-size:.88rem;
}
.ms-upload-box:hover{border-color:var(--g5);color:var(--txt);}
.ms-upload-box input{display:none;}
#ms-status{font-size:.82rem;color:var(--sub);min-height:20px;text-align:center;}
#ms-status.err{color:#ff7070;}
#ms-status.ok{color:#6fdd9a;}

/* ===== MUSIC PLAYER BAR ===== */
#music-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(10,30,18,0.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,0.12);
  padding:10px 16px 14px;
  display:none;flex-direction:column;gap:8px;
  z-index:900;max-width:480px;margin:0 auto;
  /* center on wide screens */
  left:50%;transform:translateX(-50%);width:100%;
}
#music-bar.show{display:flex;}
body.music-playing{padding-bottom:80px;}
body.music-playing #fab{ bottom:168px; }
#mb-track{font-size:.82rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#mb-controls{display:flex;align-items:center;gap:10px;}
#mb-play{
  width:36px;height:36px;border-radius:50%;
  background:var(--leaf);border:none;color:#fff;
  font-size:1rem;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
#mb-progress{flex:1;accent-color:var(--leaf);cursor:pointer;}
#mb-time{font-size:.72rem;color:var(--dim);white-space:nowrap;min-width:72px;text-align:right;}
#mb-close{
  position:absolute;top:8px;right:12px;
  background:none;border:none;color:var(--dim);font-size:1rem;cursor:pointer;
}

/* ===== FLOATING ACTION BUTTON (iOS style) ===== */
#fab{
  position:fixed;
  bottom:88px;
  right:20px;
  width:52px;height:52px;
  border-radius:50%;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1.5px solid rgba(255,255,255,0.25);
  color:#fff;
  font-size:1.4rem;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 24px rgba(0,0,0,0.25),0 1px 4px rgba(0,0,0,0.15);
  transition:transform .2s ease,background .2s ease;
  z-index:1000;
  -webkit-tap-highlight-color:transparent;
}
#fab:active{transform:scale(0.9)}
#fab.open{background:rgba(255,255,255,0.22)}

/* Menu sheet */
#fab-menu{
  position:fixed;
  bottom:88px;
  right:16px;
  width:230px;
  max-width:calc(100vw - 24px);
  background:rgba(18,46,30,0.72);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1.5px solid rgba(255,255,255,0.14);
  border-radius:18px;
  padding:8px 0;
  box-shadow:0 8px 40px rgba(0,0,0,0.35);
  z-index:999;
  opacity:0;
  transform:scale(0.88) translateY(12px);
  transform-origin:bottom right;
  pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;
}
#fab-menu.open{
  opacity:1;
  transform:scale(1) translateY(0);
  pointer-events:auto;
}
.fab-item{
  display:flex;align-items:center;gap:12px;
  padding:13px 18px;
  cursor:pointer;
  border:none;background:none;width:100%;text-align:left;
  color:var(--txt);font-size:.9rem;
  transition:background .15s;
  border-radius:0;
  -webkit-tap-highlight-color:transparent;
}
.fab-item:active{background:rgba(255,255,255,0.1)}
.fab-item + .fab-item{border-top:1px solid rgba(255,255,255,0.08)}
.fab-item span.fab-icon{font-size:1.1rem;width:24px;text-align:center;flex-shrink:0}
.fab-item span.fab-label{line-height:1.2}
.fab-item span.fab-sub{display:block;font-size:.72rem;color:var(--sub);margin-top:1px}

/* Overlay backdrop */
#fab-backdrop{
  position:fixed;inset:0;z-index:998;
  display:none;
}
#fab-backdrop.open{display:block;}

@keyframes out-left{from{transform:translateX(0);opacity:1}to{transform:translateX(-60px);opacity:0}}
@keyframes out-right{from{transform:translateX(0);opacity:1}to{transform:translateX(60px);opacity:0}}
@keyframes enter-left{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes enter-right{from{transform:translateX(-60px);opacity:0}to{transform:translateX(0);opacity:1}}
.out-left{animation:out-left .18s ease forwards}
.out-right{animation:out-right .18s ease forwards}
.enter-left{animation:enter-left .2s ease forwards}
.enter-right{animation:enter-right .2s ease forwards}

/* Cẩm nang */
#cn-search{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--g3);background:var(--g2);color:var(--txt);font-size:.95rem;margin-bottom:14px;outline:none;box-sizing:border-box}
#cn-search::placeholder{color:var(--sub)}
#cn-empty{display:none;text-align:center;padding:32px 0;color:var(--sub);font-size:.9rem}
details.cn-card{background:var(--g2);border:1px solid var(--g3);border-radius:16px;margin-bottom:14px;overflow:hidden}
details.cn-card summary{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;user-select:none;list-style:none}
details.cn-card summary::-webkit-details-marker{display:none}
.cn-emoji{font-size:1.4rem;flex:0 0 auto}
.cn-title{font-size:.95rem;font-weight:700;color:var(--txt);line-height:1.3}
.cn-chu-de{font-size:.75rem;color:var(--sub);margin-top:2px}
.cn-arrow{font-size:.8rem;color:var(--sub);transition:.2s;flex:0 0 auto}
details.cn-card[open] .cn-arrow{transform:rotate(180deg)}
.cn-body{padding:0 16px 14px;border-top:1px solid var(--g3)}
.cn-body ul{margin:10px 0 0;padding-left:18px}
.cn-body li{color:var(--sub);font-size:.9rem;line-height:1.6;margin-bottom:6px}
.cn-loading{text-align:center;padding:40px 0;color:var(--sub);font-size:.9rem}
.cn-hidden{display:none}
</style>
</head>

<div id="ses-bar">

</div>

<div id="vol-bar"></div>

</div>

  <div class="card" id="card">

<div id="nav">
  <button class="nav-btn" id="prev-btn" onclick="go(-1)">&#8592; Trước</button>

<script>
// Vol data is lazy-loaded from vols/volN.json
const volCache = {};
const volLoading = {};

async function loadVol(n) {
  if (volCache[n]) return volCache[n];
  if (volLoading[n]) return volLoading[n];
  volLoading[n] = fetch(`vols/vol${n}.json`)
    .then(r => r.json())
    .then(data => { volCache[n] = data; return data; });
  return volLoading[n];
}

// Preload adjacent vols in background
function preloadVol(n) {
  if (n >= 1 && n <= 36 && !volCache[n] && !volLoading[n]) loadVol(n);
}

const SESSIONS=[
  {
    name:"Câu Chuyện Rừng Đước",
    vols:null,
    themes:["Tổng Hợp","Khí Hậu & Thủy Triều","Sinh Vật Nhỏ Bé","Con Người & Rừng","Tình Bạn & Cộng Sinh","Thích Nghi & Sinh Tồn","Vòng Đời & Biến Đổi","Cảm Xúc & Trí Tuệ","Thời Gian & Kiên Nhẫn","Ranh Giới & Tự Do","Ánh Sáng & Bóng Tối","Ngôn Ngữ & Giao Tiếp","Nước & Sự Chảy","Hạt Giống & Nảy Mầm","Rễ & Nền Tảng","Thay Đổi & Chuyển Hóa","Cộng Đồng & Hệ Sinh Thái","Bóng Tối & Ánh Sáng","Dòng Chảy & Buông Bỏ","Ký Ức & Di Sản","Cân Bằng & Hài Hòa","Kiên Nhẫn & Thời Gian","Ranh Giới & Không Gian","Tái Sinh & Hy Vọng","Khác Biệt & Bản Sắc","Kiên Trì & Thích Nghi","Trưởng Thành & Trải Nghiệm","Kết Nối & Yêu Thương","Hy Vọng & Tái Sinh","Tình Bạn & Sẻ Chia","Chia Sẻ & Cảm Thông","Đổi Thay & Trưởng Thành","Buông Bỏ & Chữa Lành","Khám Phá & Dũng Cảm","Sinh Tồn & Bản Năng","Hòa Hợp & Cân Bằng"],
    startVol:1
  },
];

let curSes=0, curVolInSes=0;
let sesData=SESSIONS[0];
let stories=[], idx=0;
const NUM_VOLS=36;

function md(text){
  return text.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}

function buildCard(card, s, dir){
  const cls = dir==='left'?'enter-left':dir==='right'?'enter-right':'';
  card.className='card'+(cls?' '+cls:'');
  document.getElementById('c-emoji').textContent=s.e;
  document.getElementById('c-title').textContent=s.t;
  document.getElementById('c-body').innerHTML=md(s.b);
}

function buildSelect(){
  const sel=document.getElementById('story-sel');
  sel.innerHTML='';
  stories.forEach((s,i)=>{
    const o=document.createElement('option');
    o.value=i; o.textContent=(i+1)+'. '+s.t;
    sel.appendChild(o);
  });
  sel.value=idx;
}

function updateCounter(){
  document.getElementById('counter').textContent=(idx+1)+' / '+stories.length;
  document.getElementById('prev-btn').disabled=idx===0;
  document.getElementById('next-btn').disabled=idx===stories.length-1;
  document.getElementById('story-sel').value=idx;
}

function go(d){
  const ni=idx+d;
  if(ni<0||ni>=stories.length) return;
  const card=document.getElementById('card');
  const outCls=d>0?'out-left':'out-right';
  card.classList.add(outCls);
  setTimeout(()=>{
    idx=ni;
    buildCard(card,stories[idx],d>0?'left':'right');
    updateCounter();
  },160);
}

function rand(){
  const ni=Math.floor(Math.random()*stories.length);
  const card=document.getElementById('card');
  card.classList.add('out-left');
  setTimeout(()=>{
    idx=ni;
    buildCard(card,stories[idx],'left');
    updateCounter();
  },160);
}

function buildVolBar(){
  const bar=document.getElementById('vol-bar');
  bar.innerHTML='';
  for(let i=0;i<NUM_VOLS;i++){
    const b=document.createElement('button');
    b.className='vol-btn'+(i===curVolInSes?' active':'');
    b.dataset.vol=i;
    b.textContent='Vol '+(sesData.startVol+i);
    b.addEventListener('click',()=>switchVol(i));
    bar.appendChild(b);
  }
}

function showLoading(){
  const card=document.getElementById('card');
  card.className='card';
  document.getElementById('c-emoji').textContent='⏳';
  document.getElementById('c-title').textContent='Đang tải...';
  document.getElementById('c-body').innerHTML='';
}

async function switchVol(v){
  curVolInSes=v; idx=0;
  document.querySelectorAll('.vol-btn').forEach((b,i)=>b.classList.toggle('active',i===v));
  showLoading();
  const volNum=sesData.startVol+v;
  stories=await loadVol(volNum);
  buildSelect();
  buildCard(document.getElementById('card'),stories[0],'left');
  updateCounter();
  // Preload neighbours
  preloadVol(volNum-1);
  preloadVol(volNum+1);
}

async function switchSes(s){
  showStories();
  curSes=s; curVolInSes=0;
  sesData=SESSIONS[s];
  idx=0;
  document.querySelectorAll('.ses-btn').forEach((b,i)=>b.classList.toggle('active',!b.dataset.mode&&i===s));
  buildVolBar();
  showLoading();
  stories=await loadVol(sesData.startVol);
  buildSelect();
  buildCard(document.getElementById('card'),stories[0],'left');
  updateCounter();
  preloadVol(sesData.startVol+1);
}

document.getElementById('story-sel').addEventListener('change',function(){
  const ni=parseInt(this.value);
  if(ni===idx) return;
  const d=ni>idx?1:-1;
  const card=document.getElementById('card');
  card.classList.add(d>0?'out-left':'out-right');
  setTimeout(()=>{
    idx=ni;
    buildCard(card,stories[idx],d>0?'left':'right');
    updateCounter();
  },160);
});

document.querySelectorAll('.ses-btn').forEach(btn=>{
  if(btn.dataset.ses!==undefined){
    btn.addEventListener('click',()=>switchSes(parseInt(btn.dataset.ses)));
  }
});

// ===== Cẩm nang bỏ túi =====
let camnangsLoaded=false;

function parseCamnangs(md){
  const blocks=md.split(/^## /m).filter(b=>b.trim());
  return blocks.map(block=>{
    const lines=block.split('\n').filter(l=>l.trim());
    const title=lines[0]?.trim()||'';
    let emoji='📋', chu_de='';
    const items=[];
    lines.slice(1).forEach(l=>{
      const em=l.match(/^emoji:\s*(.+)/i);
      const cd=l.match(/^chu[_-]de:\s*(.+)/i);
      const item=l.match(/^-\s+(.+)/);
      if(em) emoji=em[1].trim();
      else if(cd) chu_de=cd[1].trim();
      else if(item) items.push(item[1].trim());
    });
    return {title,emoji,chu_de,items};
  }).filter(c=>c.title&&c.items.length>0);
}

function renderCamnangs(list){
  const el=document.getElementById('camnangs-list');
  if(!list.length){
    el.innerHTML='<div class="cn-loading">Chưa có cẩm nang nào.</div>';
    return;
  }
  // Dùng <details>/<summary> native — không cần JS toggle
  el.innerHTML=list.map((c,i)=>`
    <details class="cn-card" data-title="${c.title.toLowerCase()} ${c.chu_de.toLowerCase()}">
      <summary>
        <span class="cn-emoji">${c.emoji}</span>
        <div style="flex:1">
          <div class="cn-title">${c.title}</div>
          ${c.chu_de?`<div class="cn-chu-de">${c.chu_de}</div>`:''}
        </div>
        <span class="cn-arrow">▼</span>
      </summary>
      <div class="cn-body">
        <ul>${c.items.map(it=>`<li>${it}</li>`).join('')}</ul>
      </div>
    </details>
  `).join('');

  // Event delegation cho search filter
  document.getElementById('cn-search').addEventListener('input', filterCamnangs);
}

function filterCamnangs(){
  const q=this.value.toLowerCase().trim();
  const cards=document.querySelectorAll('details.cn-card');
  let visible=0;
  cards.forEach(c=>{
    const match=!q||c.dataset.title.includes(q);
    c.classList.toggle('cn-hidden',!match);
    if(match) visible++;
  });
  document.getElementById('cn-empty').style.display=visible?'none':'block';
}

async function loadCamnangs(){
  if(camnangsLoaded) return;
  const el=document.getElementById('camnangs-list');
  el.innerHTML='<div class="cn-loading">Đang tải...</div>';
  try{
    // Bỏ Date.now() — để browser cache 1h theo _headers
    const r=await fetch('camnangs.md');
    const txt=await r.text();
    renderCamnangs(parseCamnangs(txt));
    camnangsLoaded=true;
  }catch(e){
    el.innerHTML='<div class="cn-loading">Không tải được dữ liệu.</div>';
  }
}

function showCamnangs(){
  document.getElementById('story-wrap').style.display='none';
  document.getElementById('nav').style.display='none';
  document.getElementById('vol-bar').style.display='none';
  document.getElementById('controls').style.display='none';
  const cv=document.getElementById('camnangs-view');
  cv.style.display='flex';
  cv.style.flexDirection='column';
  document.querySelectorAll('.ses-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode==='camnangs'));
  loadCamnangs();

function showStories(){
  document.getElementById('story-wrap').style.display='';
  document.getElementById('nav').style.display='';
  document.getElementById('vol-bar').style.display='';
  document.getElementById('controls').style.display='';
  document.getElementById('camnangs-view').style.display='none';

document.querySelector('.ses-btn[data-mode="camnangs"]').addEventListener('click', showCamnangs);

// Touch swipe
let tx=0;
const wrap=document.getElementById('story-wrap');
wrap.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
wrap.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;

},{passive:true});

(async()=>{
  buildVolBar();
  showLoading();
  stories=await loadVol(1);

// ===== FAB (Floating Action Button) =====
function positionFabMenu(){
  const fab=document.getElementById('fab');
  const menu=document.getElementById('fab-menu');
  const MARGIN=12;
  const MENU_W=230;
  const MENU_H=menu.scrollHeight||280; // ước tính nếu chưa render
  const W=window.innerWidth;
  const H=window.innerHeight;
  const rect=fab.getBoundingClientRect();

  // Căn theo cạnh nút
  let left=rect.left; // mặc định: menu bên phải nút
  let top=rect.top-MENU_H-8; // mặc định: menu phía trên nút

  // Nếu menu bị tràn phải → đẩy vào trong
  if(left+MENU_W > W-MARGIN) left=W-MENU_W-MARGIN;
  // Nếu bị tràn trái
  if(left < MARGIN) left=MARGIN;
  // Nếu menu bị che phía trên → hiện xuống dưới nút
  if(top < MARGIN) top=rect.bottom+8;
  // Nếu vẫn tràn dưới
  if(top+MENU_H > H-MARGIN) top=H-MENU_H-MARGIN;

  menu.style.left=left+'px';
  menu.style.top=top+'px';
  menu.style.right='auto';
  menu.style.bottom='auto';
  // transform-origin luôn hướng về phía nút
  const originX = rect.left < W/2 ? 'left' : 'right';
  const originY = top < rect.top ? 'bottom' : 'top';
  menu.style.transformOrigin=originY+' '+originX;
}

function toggleFab(){
  if(window._fabDragged) return; // bỏ qua click nếu vừa kéo
  const fab=document.getElementById('fab');
  const menu=document.getElementById('fab-menu');
  const bd=document.getElementById('fab-backdrop');
  const isOpen=menu.classList.contains('open');
  if(isOpen){
    menu.classList.remove('open');
    fab.classList.remove('open');
    bd.classList.remove('open');
    fab.textContent='🌿';
  } else {
    positionFabMenu();
    menu.classList.add('open');
    fab.classList.add('open');
    bd.classList.add('open');
    fab.textContent='✕';
  }
}
function closeFab(){
  const fab=document.getElementById('fab');
  document.getElementById('fab-menu').classList.remove('open');
  document.getElementById('fab-backdrop').classList.remove('open');
  fab.classList.remove('open');
  fab.textContent='🌿';
}

/* ── FAB drag-to-move ─────────────────────────────── */
(function(){
  const fab=document.getElementById('fab');
  let dragging=false, startX, startY, origRight, origBottom;

  function getPos(){
    const style=getComputedStyle(fab);
    // fab dùng right/bottom; convert sang left/top nếu cần
    const r=parseInt(fab.style.right)||20;
    const b=parseInt(fab.style.bottom)||24;
    return {r,b};
  }

  function pointerDown(e){
    if(e.type==='mousedown' && e.button!==0) return;
    const pt=e.touches?e.touches[0]:e;
    startX=pt.clientX; startY=pt.clientY;
    const {r,b}=getPos();
    origRight=r; origBottom=b;
    dragging=false;
    window._fabDragged=false;
    fab.style.transition='none';
    document.addEventListener('mousemove',pointerMove,{passive:false});
    document.addEventListener('touchmove',pointerMove,{passive:false});
    document.addEventListener('mouseup',pointerUp);
    document.addEventListener('touchend',pointerUp);
  }

  function pointerMove(e){
    const pt=e.touches?e.touches[0]:e;
    const dx=pt.clientX-startX;
    const dy=pt.clientY-startY;
    if(!dragging && Math.hypot(dx,dy)<6) return;
    dragging=true;
    window._fabDragged=true;
    e.preventDefault();

    const W=window.innerWidth, H=window.innerHeight;
    const SIZE=52;
    const MARGIN=12;
    // right giảm khi kéo phải, tăng khi kéo trái
    let newRight=origRight-dx;
    let newBottom=origBottom-dy;
    newRight=Math.max(MARGIN, Math.min(W-SIZE-MARGIN, newRight));
    newBottom=Math.max(MARGIN, Math.min(H-SIZE-MARGIN, newBottom));
    fab.style.right=newRight+'px';
    fab.style.bottom=newBottom+'px';
  }

  function pointerUp(){
    fab.style.transition='';
    document.removeEventListener('mousemove',pointerMove);
    document.removeEventListener('touchmove',pointerMove);
    document.removeEventListener('mouseup',pointerUp);
    document.removeEventListener('touchend',pointerUp);
    // reset flag sau 1 frame để onclick không fire
    if(dragging) setTimeout(()=>{ window._fabDragged=false; },50);
    dragging=false;
  }

  fab.addEventListener('mousedown',pointerDown);
  fab.addEventListener('touchstart',pointerDown,{passive:true});
})();

function goTop(){

}

function shareStory(){
  const title=document.getElementById('c-title').textContent;
  const url=window.location.href;
  if(navigator.share){
    navigator.share({title:'🌿 '+title+' – Rừng Ngập Mặn',url:url}).catch(()=>{});
  } else {
    navigator.clipboard.writeText(url).then(()=>{
      showToast('✅ Đã copy link!');
    }).catch(()=>{
      showToast('📋 '+url);
    });
  }
}

}

function showToast(msg){
  let t=document.getElementById('toast');
  if(!t){
    t=document.createElement('div');
    t.id='toast';
    Object.assign(t.style,{
      position:'fixed',bottom:'96px',left:'50%',transform:'translateX(-50%)',
      background:'rgba(18,46,30,0.88)',backdropFilter:'blur(16px)',
      WebkitBackdropFilter:'blur(16px)',
      color:'#e8f5ee',padding:'10px 20px',borderRadius:'24px',
      fontSize:'.88rem',zIndex:'1100',whiteSpace:'nowrap',
      border:'1px solid rgba(255,255,255,0.15)',
      boxShadow:'0 4px 20px rgba(0,0,0,0.3)',
      transition:'opacity .3s',opacity:'0'
    });
    document.body.appendChild(t);
  }
  t.textContent=msg;
  t.style.opacity='1';
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>{ t.style.opacity='0'; },2500);
}

/* ============================================================
   MUSIC MODAL + PLAYER
   ============================================================ */

function openMusicModal(){
  document.getElementById('music-overlay').classList.add('open');
}
function closeMusicModal(){
  document.getElementById('music-overlay').classList.remove('open');
}

function setMsStatus(msg, type=''){
  const el=document.getElementById('ms-status');
  el.textContent=msg;
  el.className=type;
}

/* ---------- Local file upload ---------- */
function handleFileUpload(e){
  const file=e.target.files[0];
  if(!file){ return; }
  const blobUrl=URL.createObjectURL(file);
  const baseName=file.name.replace(/\.[^.]+$/,'');
  playInModal(blobUrl, baseName);
  window._msCurrentFile=file; // giữ file gốc để trích âm thanh khi lưu
  setMsStatus('✅ Đã tải: '+file.name,'ok');
  document.getElementById('ms-upload-label').style.borderColor='var(--g5)';
}

/* ---------- Play in modal mini-player ---------- */
function playInModal(src, title){
  const audio=document.getElementById('ms-audio');
  const trackEl=document.getElementById('ms-track');
  const playerEl=document.getElementById('ms-player');
  audio.src=src;
  trackEl.textContent='🎵 '+title;
  playerEl.style.display='flex';
  audio.play().catch(()=>{});
  // keep ref for bar + save
  window._msCurrentSrc=src;
  window._msCurrentTitle=title;
  // điền tên file gợi ý
  const nameInput=document.getElementById('ms-save-name');
  nameInput.value=title.replace(/[\\/:*?"<>|]/g,'_');
}

/* ---------- Lưu âm thanh xuống máy ---------- */
async function saveMp3(){
  const origFile=window._msCurrentFile;
  const src=window._msCurrentSrc;
  if(!src && !origFile){ setMsStatus('⚠️ Chưa có file để lưu','err'); return; }

  let baseName=(document.getElementById('ms-save-name').value.trim()||window._msCurrentTitle||'audio');
  baseName=baseName.replace(/\.[^.]+$/,'').replace(/[\\/:*?"<>|]/g,'_');

  const btn=document.querySelector('#ms-save-box .ms-btn');
  btn.disabled=true;

  // --- Cách 1: decodeAudioData (nhanh, MP3/WAV/AAC/M4A) ---
  try{
    setMsStatus('⏳ Đang trích âm thanh...','');
    let arrayBuf;
    if(origFile) arrayBuf=await origFile.arrayBuffer();
    else { const r=await fetch(src); arrayBuf=await r.arrayBuffer(); }

    const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const audioBuffer=await new Promise((res,rej)=>{
      audioCtx.decodeAudioData(arrayBuf, res, rej);
    });
    audioCtx.close();
    const wavBlob=audioBufferToWav(audioBuffer);
    downloadBlob(wavBlob, baseName+'.wav');
    setMsStatus('✅ Đã lưu: '+baseName+'.wav','ok');
    btn.disabled=false;
    return;
  }catch(_){}

  // --- Cách 2: Record real-time qua ScriptProcessor (iOS Safari với .mov) ---
  try{
    setMsStatus('⏳ Đang ghi âm – đừng tắt màn hình...','');

    // Dùng thẻ video ẩn để Safari decode .mov
    const vid=document.createElement('video');
    vid.src=src; vid.muted=false; vid.preload='auto';
    vid.style.display='none'; document.body.appendChild(vid);
    await new Promise((res,rej)=>{
      vid.oncanplay=res;
      vid.onerror=()=>rej(new Error('Không phát được file này trên trình duyệt'));
      setTimeout(()=>rej(new Error('Timeout tải file')),10000);
    });

    const duration=vid.duration;
    const SR=44100;
    const numCh=2;
    const audioCtx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:SR});
    const source=audioCtx.createMediaElementSource(vid);
    const bufSize=4096;
    const processor=audioCtx.createScriptProcessor(bufSize,numCh,numCh);

    // Gom PCM samples
    const recorded=[[],[]];
    processor.onaudioprocess=e=>{
      for(let c=0;c<numCh;c++){
        const ch=e.inputBuffer.getChannelData(c);
        recorded[c].push(new Float32Array(ch));
      }
    };
    source.connect(processor);
    processor.connect(audioCtx.destination);

    // Phát từ đầu
    vid.currentTime=0;
    await vid.play();

    // Chờ hết bài
    await new Promise(res=>{
      vid.onended=res;
      setTimeout(res,(duration+2)*1000); // fallback timeout
    });

    processor.disconnect(); source.disconnect(); audioCtx.close();
    document.body.removeChild(vid);

    // Ghép samples thành AudioBuffer
    const totalLen=recorded[0].reduce((a,b)=>a+b.length,0);
    const offCtx=new OfflineAudioContext(numCh,totalLen,SR);
    const finalBuf=offCtx.createBuffer(numCh,totalLen,SR);
    for(let c=0;c<numCh;c++){
      const ch=finalBuf.getChannelData(c);
      let off=0;
      for(const chunk of recorded[c]){ ch.set(chunk,off); off+=chunk.length; }
    }

    const wavBlob=audioBufferToWav(finalBuf);
    downloadBlob(wavBlob, baseName+'.wav');
    setMsStatus('✅ Đã lưu: '+baseName+'.wav','ok');
  }catch(e){
    setMsStatus('❌ '+e.message,'err');
  }finally{
    btn.disabled=false;
  }
}

function downloadBlob(blob, filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),8000);
}

/* Encode AudioBuffer → WAV Blob */
function audioBufferToWav(buf){
  const numCh=buf.numberOfChannels;
  const sr=buf.sampleRate;
  const len=buf.length;
  const bytesPerSample=2;
  const blockAlign=numCh*bytesPerSample;
  const byteRate=sr*blockAlign;
  const dataSize=len*blockAlign;
  const ab=new ArrayBuffer(44+dataSize);
  const view=new DataView(ab);

  function write(offset,str){ for(let i=0;i<str.length;i++) view.setUint8(offset+i,str.charCodeAt(i)); }
  function u32(o,v){ view.setUint32(o,v,true); }
  function u16(o,v){ view.setUint16(o,v,true); }

  write(0,'RIFF'); u32(4,36+dataSize); write(8,'WAVE');
  write(12,'fmt '); u32(16,16); u16(20,1); u16(22,numCh);
  u32(24,sr); u32(28,byteRate); u16(32,blockAlign); u16(34,16);
  write(36,'data'); u32(40,dataSize);

  // interleave channels
  const channels=[];
  for(let c=0;c<numCh;c++) channels.push(buf.getChannelData(c));
  let offset=44;
  for(let i=0;i<len;i++){
    for(let c=0;c<numCh;c++){
      const s=Math.max(-1,Math.min(1,channels[c][i]));
      view.setInt16(offset,s<0?s*0x8000:s*0x7fff,true);
      offset+=2;
    }
  }
  return new Blob([ab],{type:'audio/wav'});
}

/* ---------- Pin to bottom bar ---------- */
function pinToBar(){
  const src=window._msCurrentSrc;
  const title=window._msCurrentTitle;
  if(!src){ return; }
  const modalAudio=document.getElementById('ms-audio');
  const curTime=modalAudio.currentTime;
  modalAudio.pause();

  const bar=document.getElementById('music-bar');
  const barAudio=document.getElementById('bar-audio');
  document.getElementById('mb-track').textContent='🎵 '+title;
  barAudio.src=src;
  barAudio.currentTime=curTime;
  bar.classList.add('show');
  document.body.classList.add('music-playing');
  barAudio.play().catch(()=>{});
  document.getElementById('mb-play').textContent='⏸';

  barAudio.ontimeupdate=updateBarProgress;
  barAudio.onended=()=>{ document.getElementById('mb-play').textContent='▶'; };

  closeMusicModal();
  showToast('📌 Đã ghim – nhạc tiếp tục phát dưới màn hình');
}

function toggleBarPlay(){
  const a=document.getElementById('bar-audio');
  const btn=document.getElementById('mb-play');
  if(a.paused){ a.play(); btn.textContent='⏸'; }
  else { a.pause(); btn.textContent='▶'; }
}

function seekBar(val){
  const a=document.getElementById('bar-audio');
  if(a.duration) a.currentTime=(val/100)*a.duration;
}

function updateBarProgress(){
  const a=document.getElementById('bar-audio');
  if(!a.duration) return;
  const pct=(a.currentTime/a.duration)*100;
  document.getElementById('mb-progress').value=pct;
  document.getElementById('mb-time').textContent=fmtTime(a.currentTime)+' / '+fmtTime(a.duration);
}

function closeMusicBar(){
  const a=document.getElementById('bar-audio');
  a.pause(); a.src='';
  document.getElementById('music-bar').classList.remove('show');
  document.body.classList.remove('music-playing');
}

function fmtTime(s){
  if(isNaN(s)) return '0:00';
  const m=Math.floor(s/60);
  const sec=Math.floor(s%60).toString().padStart(2,'0');
  return m+':'+sec;
}

/* ===== LIBRARY ===== */
let libIndex=null;

function libFileIcon(name){
  const ext=name.split('.').pop().toLowerCase();
  const map={pdf:'📄',doc:'📝',docx:'📝',txt:'🗒️',md:'📋',rtf:'📃',
             csv:'📊',json:'🔧',html:'🌐',htm:'🌐',xml:'📑'};
  return map[ext]||'📁';
}

function libFileSize(bytes){
  if(!bytes)return '';
  if(bytes<1024)return bytes+'B';
  if(bytes<1048576)return (bytes/1024).toFixed(1)+'KB';
  return (bytes/1048576).toFixed(1)+'MB';
}

async function openLibrary(){
  document.getElementById('lib-overlay').classList.add('open');
  if(libIndex===null) await libLoadIndex();
  else libRenderList();
}

function closeLibrary(){
  document.getElementById('lib-overlay').classList.remove('open');
  libCloseReader();
}

async function libLoadIndex(){
  const el=document.getElementById('lib-list');
  el.innerHTML='<div style="color:var(--sub);font-size:.85rem;text-align:center;padding:24px">Đang tải danh sách…</div>';
  try{
    const r=await fetch('library/index.json?v='+Date.now());
    libIndex=await r.json();
    libRenderList();
  }catch(e){
    el.innerHTML='<div style="color:var(--sub);font-size:.85rem;text-align:center;padding:24px">Không tải được danh sách file.</div>';
  }
}

function libRenderList(){
  const el=document.getElementById('lib-list');
  if(!libIndex||libIndex.length===0){
    el.innerHTML='<div style="color:var(--sub);font-size:.85rem;text-align:center;padding:32px">Thư viện chưa có file nào.</div>';
    return;
  }
  el.innerHTML=libIndex.map((f,i)=>`
    <div class="lib-file-item">
      <span class="lib-file-icon">${libFileIcon(f.name)}</span>
      <div class="lib-file-info">
        <div class="lib-file-name">${f.title||f.name}</div>
        <div class="lib-file-meta">${f.desc?f.desc+' · ':''}${libFileSize(f.size)}</div>
      </div>
      <div class="lib-file-actions">
        <button class="lib-btn" onclick="libOpenReader(${i})">👁 Đọc</button>
        <a class="lib-btn" href="library/${encodeURIComponent(f.name)}" download="${f.name}" style="text-decoration:none">⬇ Tải</a>
      </div>
    </div>
  `).join('');
}

async function libOpenReader(i){
  const f=libIndex[i];
  const ext=f.name.split('.').pop().toLowerCase();
  const url='library/'+encodeURIComponent(f.name);

  document.getElementById('lib-list').style.display='none';
  document.getElementById('lib-reader').style.display='block';
  document.getElementById('lib-reader-title').textContent=f.title||f.name;

  const dlBtn=document.getElementById('lib-dl-btn');
  dlBtn.href=url;dlBtn.download=f.name;

  const body=document.getElementById('lib-reader-body');
  body.innerHTML='<span style="color:var(--sub)">Đang tải…</span>';

  if(['txt','md','csv','json','xml','rtf'].includes(ext)){
    try{
      const text=await (await fetch(url)).text();
      if(ext==='md' && typeof marked!=='undefined'){
        marked.setOptions({breaks:true,gfm:true});
        body.innerHTML=marked.parse(text);
      } else {
        body.innerHTML=`<pre style="white-space:pre-wrap;word-break:break-word;font-size:.82rem;line-height:1.65;font-family:inherit">${text.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</pre>`;
      }
    }catch{body.innerHTML='<span style="color:var(--sub)">Không tải được file.</span>';}
  } else if(ext==='html'||ext==='htm'){
    body.innerHTML=`<iframe src="${url}" style="width:100%;min-height:58dvh;border:none;border-radius:8px"></iframe>`;
  } else if(ext==='pdf'){
    body.innerHTML=`<iframe src="${url}" style="width:100%;min-height:62dvh;border:none;border-radius:8px"></iframe>`;
  } else if(['doc','docx'].includes(ext)){
    body.innerHTML=`<div style="text-align:center;padding:28px;color:var(--sub)">
      <div style="font-size:2rem;margin-bottom:10px">📝</div>
      <div style="font-weight:600;margin-bottom:8px">${f.title||f.name}</div>
      <div style="font-size:.82rem;margin-bottom:18px">Trình duyệt không hỗ trợ đọc trực tiếp file Word.<br>Vui lòng tải về để mở bằng ứng dụng.</div>
      <a class="ms-btn" href="${url}" download="${f.name}" style="text-decoration:none;display:inline-block">⬇ Tải file về</a>
    </div>`;
  } else {
    body.innerHTML=`<div style="text-align:center;padding:24px;color:var(--sub)">Không thể đọc trực tiếp loại file này.<br>Vui lòng tải về.</div>`;
  }
}

function libCloseReader(){
  document.getElementById('lib-reader').style.display='none';
  document.getElementById('lib-list').style.display='';
  document.getElementById('lib-reader-body').innerHTML='';
}
</script>
