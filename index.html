<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mangrove – Video</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0f0d;
      color: #e8f5e9;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #4caf7d;
      text-shadow: 0 0 24px rgba(76, 175, 80, 0.35);
    }

    header p {
      margin-top: 8px;
      font-size: 1rem;
      color: #81c784;
      opacity: 0.8;
    }

    .player-wrap {
      width: 100%;
      max-width: 900px;
      background: #0d1f15;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 48px rgba(0,0,0,0.6), 0 0 0 1px rgba(76,175,80,0.15);
    }

    video {
      width: 100%;
      display: block;
      background: #000;
    }

    .controls {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: #0d1f15;
      border-top: 1px solid rgba(76,175,80,0.12);
    }

    .btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #4caf7d;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 50%;
      transition: background 0.15s;
    }
    .btn:hover { background: rgba(76,175,80,0.15); }
    .btn svg { width: 22px; height: 22px; fill: currentColor; }

    .progress-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .progress-bar {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.12);
      cursor: pointer;
      accent-color: #4caf7d;
    }
    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #4caf7d;
      cursor: pointer;
    }

    .time {
      font-size: 0.72rem;
      color: #81c784;
      opacity: 0.7;
      letter-spacing: 0.03em;
    }

    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 70px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.12);
      cursor: pointer;
      accent-color: #4caf7d;
    }

    footer {
      margin-top: 28px;
      font-size: 0.78rem;
      color: #4caf7d;
      opacity: 0.4;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

<header>
  <h1>🌿 Mangrove</h1>
  <p>Trình chiếu video</p>
</header>

<div class="player-wrap">
  <video id="vid" preload="metadata">
    <source src="video.mov" type="video/quicktime" />
    <source src="video.mov" type="video/mp4" />
    Trình duyệt của bạn không hỗ trợ phát video.
  </video>

  <div class="controls">
    <!-- Play/Pause -->
    <button class="btn" id="playBtn" title="Phát / Tạm dừng">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>

    <!-- Progress -->
    <div class="progress-wrap">
      <input type="range" class="progress-bar" id="progress" value="0" min="0" step="0.1" />
      <span class="time" id="timeDisplay">0:00 / 0:00</span>
    </div>

    <!-- Volume -->
    <div class="volume-wrap">
      <button class="btn" id="muteBtn" title="Tắt / Bật tiếng">
        <svg id="volIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </button>
      <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.05" value="1" />
    </div>

    <!-- Fullscreen -->
    <button class="btn" id="fsBtn" title="Toàn màn hình">
      <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>
  </div>
</div>

<footer>Mangrove Project © 2026</footer>

<script>
  const vid = document.getElementById('vid');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const progress = document.getElementById('progress');
  const timeDisplay = document.getElementById('timeDisplay');
  const muteBtn = document.getElementById('muteBtn');
  const volIcon = document.getElementById('volIcon');
  const volume = document.getElementById('volume');
  const fsBtn = document.getElementById('fsBtn');

  const PLAY_PATH = 'M8 5v14l11-7z';
  const PAUSE_PATH = 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';
  const VOL_ON = 'M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z';
  const VOL_OFF = 'M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06A8.99 8.99 0 0 0 17.73 18L19 19.27 20.27 18 5.27 3 4.27 3zM12 4L9.91 6.09 12 8.18V4z';

  function fmt(s) {
    if (isNaN(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  }

  playBtn.addEventListener('click', () => {
    vid.paused ? vid.play() : vid.pause();
  });

  vid.addEventListener('play', () => playIcon.setAttribute('d', PAUSE_PATH));
  vid.addEventListener('pause', () => playIcon.setAttribute('d', PLAY_PATH));

  vid.addEventListener('timeupdate', () => {
    if (vid.duration) {
      progress.value = (vid.currentTime / vid.duration) * 100;
      timeDisplay.textContent = `${fmt(vid.currentTime)} / ${fmt(vid.duration)}`;
    }
  });

  vid.addEventListener('loadedmetadata', () => {
    progress.max = 100;
    timeDisplay.textContent = `0:00 / ${fmt(vid.duration)}`;
  });

  progress.addEventListener('input', () => {
    vid.currentTime = (progress.value / 100) * vid.duration;
  });

  volume.addEventListener('input', () => {
    vid.volume = volume.value;
    vid.muted = volume.value == 0;
    volIcon.setAttribute('d', vid.muted ? VOL_OFF : VOL_ON);
  });

  muteBtn.addEventListener('click', () => {
    vid.muted = !vid.muted;
    volume.value = vid.muted ? 0 : vid.volume;
    volIcon.setAttribute('d', vid.muted ? VOL_OFF : VOL_ON);
  });

  fsBtn.addEventListener('click', () => {
    const el = document.querySelector('.player-wrap');
    if (document.fullscreenElement) document.exitFullscreen();
    else el.requestFullscreen();
  });
</script>
</body>
</html>
